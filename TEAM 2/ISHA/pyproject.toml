[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capstone-project"
version = "0.1.0"
description = """capstone project for Service Centre Capacity
Intelligence of bmw vehicles"""

requires-python = ">=3.10"
dependencies = [
  "pyspark>=4.0,<5",
  
  "pandas" ,
  "pyarrow" ,
 
  "pydotenv",
   # ML framework
    "scikit-learn>=1.5",
 
   
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
 
    
 
    # Utilities
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "skl2onnx>=1.14",
    "nltk>=3.9",
    "requests",
     "beautifulsoup4",
     "wordcloud",
     "spacy",
     "transformers",
     "torch",
     "stanford-corenlp",
     "bertopic",
     "anthropic",
     "openai",
     "google-genai",
     "langgraph",
     "ipython"
 
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/azuremlapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"