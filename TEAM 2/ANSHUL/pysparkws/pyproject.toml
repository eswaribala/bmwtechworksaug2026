[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PerformETLonsalesdata"
version = "0.1.0"
description = "I have sales data and i have to perform ETL on it for further analytics"

requires-python = ">=3.10"
dependencies = [
  "pyspark>=4.0,<5",
  "python-dotenv>=1.0,<2",
  "pyarrow",
  "pandas",
  "pydotenv",
 
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/azuremlapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"