[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-app"
version = "1.0.0"
description = "Simple vehicle application"
requires-python = ">=3.10"

dependencies = [
  
  "pytest>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]