[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-battery-health-intelligence"
version = "0.1.0"
description = "EV battery health intelligence project for BMW battery degradation analysis and dashboarding"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Capstone Project Team" }
]
license = { text = "MIT" }
keywords = ["ev", "battery", "pyspark", "analytics", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "pyspark>=3.5.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "boto3>=1.34.0",
  "pyathena>=3.0.0",
  "python-dotenv>=1.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "isort>=5.13.0",
  "ruff>=0.4.0",
]
docs = [
  "sphinx>=7.0",
  "sphinxcontrib-mermaid>=0.9",
]

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
