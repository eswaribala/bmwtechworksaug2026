[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrrithika-snowflake-dw"
version = "1.0.0"
description = "BMW Incremental Data Warehouse using AWS S3, PySpark and Snowflake"
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "boto3>=1.35.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "snowflake-connector-python>=3.12.0",
    "pyspark>=4.0.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0"
]

[project.scripts]
bmw-ingest = "python.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["python*", "pyspark*"]