# SonarQube / SonarCloud Project Configuration

sonar.projectKey=bmw-service-knowledge-rag
sonar.organization=deepakkumarl
sonar.projectName=BMW Service Knowledge RAG Capstone
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=py
sonar.python.version=3.11

# Coverage reporting path generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=data/**, .venv/**, docs/**, sql/**, terraform/**, **/__pycache__/**, *.json
sonar.test.inclusions=tests/test_*.py

# Encoding
sonar.sourceEncoding=UTF-8