[project]
name = "bmw-serverless-data-lake"
version = "0.1.0"
description = "BMW Serverless Data Lake Analytics project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "pyspark>=3.5.0",
    "pyarrow>=15.0.0",
    "pytest>=8.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
