name: BMW Natural Language Analyst CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Snowflake CI configuration
      SNOWFLAKE_ACCOUNT: ci-test-account
      SNOWFLAKE_USER: ci-test-user
      SNOWFLAKE_PASSWORD: ci-test-password
      SNOWFLAKE_AUTHENTICATOR: snowflake
      SNOWFLAKE_ROLE: BMW_ANALYST_READONLY
      SNOWFLAKE_WAREHOUSE: BMW_WH
      SNOWFLAKE_DATABASE: BMW_ANALYTICS
      SNOWFLAKE_SCHEMA: BMW_DATA

      # Local Ollama configuration
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2:1b

      # API configuration
      API_HOST: 127.0.0.1
      API_PORT: 8000

      # Streamlit configuration
      STREAMLIT_HOST: 127.0.0.1
      STREAMLIT_PORT: 8501

      # Application configuration
      MCP_SERVER_NAME: BMW Natural Language Analyst
      APP_NAME: BMW Natural Language Data Analyst
      LOG_LEVEL: INFO

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src config tests

      - name: Run unit and security tests
        run: python -m pytest -q -m "not integration"