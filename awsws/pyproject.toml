[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-deploy"
version = "0.1.0"
description = "S3 File Upload and Download"

requires-python = ">=3.10"
dependencies = [
  "pyspark>=4.0,<5",
  "python-dotenv>=1.0,<2", 
  "pydotenv",
  "boto3"
 
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/azuremlapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
